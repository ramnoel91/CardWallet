<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Card Wallet</title>
<style>
:root{
  --bg:#f4f1ea; --bg2:#ebe6db; --card:#ffffff; --ink:#18201d; --muted:#6c736f; --line:#e3ddd0;
  --brand:#0e5a4a; --brand-2:#0a4639; --brand-soft:#e2efe9; --gold:#d9a441; --gold-soft:#f8eed9;
  --warn:#b4541a; --warn-soft:#fbeadf; --blue:#3a4fb5; --blue-soft:#e8ebfa; --red:#b42318;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 18px rgba(20,30,25,.06);
  --r:18px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
html.dark{
  --bg:#0f1412; --bg2:#151c19; --card:#1a221f; --ink:#ecf0ee; --muted:#9aa5a0; --line:#2a3430;
  --brand:#3fb08f; --brand-2:#2f8f73; --brand-soft:#173029; --gold:#e3b45a; --gold-soft:#2e2717;
  --warn:#f0965e; --warn-soft:#3a2418; --blue:#8d9cf2; --blue-soft:#1f2440; --red:#f07468;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased}
body{padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
.hide{display:none!important}

/* ---------- hero ---------- */
.hero{background:linear-gradient(150deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 64px;position:relative;overflow:hidden}
html.dark .hero{background:linear-gradient(150deg,#13392f 0%,#0c241e 100%)}
.hero:after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero:before{content:"";position:absolute;right:40px;top:70px;width:120px;height:120px;border-radius:50%;background:rgba(217,164,65,.14)}
.hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.greet{font-size:14px;opacity:.8}
.brandname{font-size:26px;font-weight:750;letter-spacing:-.5px;margin-top:2px}
.brandname span{color:var(--gold)}
.hbtn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;text-align:left}
.stat b{display:block;font-size:22px;font-weight:750}
.stat small{font-size:12px;opacity:.85}
.stat.alert b{color:#ffd28a}

.wrap{max-width:600px;margin:0 auto;padding:0 14px calc(120px + env(safe-area-inset-bottom))}
.searchbar{margin:-28px 0 0;position:relative;z-index:2;display:flex;gap:8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.search input{border:0;outline:0;background:transparent;padding:14px 0;flex:1;min-width:0}
.sortbtn{width:52px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.chips{display:flex;gap:7px;margin:14px -14px 4px;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 12px;border-radius:999px;font-size:13.5px;white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:550}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sec h3{margin:0;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec a,.sec button{font-size:13.5px;color:var(--brand);font-weight:600}

/* due strip */
.duestrip{display:flex;gap:10px;overflow-x:auto;margin:0 -14px;padding:2px 14px 6px;scrollbar-width:none}
.duestrip::-webkit-scrollbar{display:none}
.due{flex:none;width:210px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);text-align:left}
.due .when{font-size:12px;font-weight:700;color:var(--warn)}
.due .when.soon{color:var(--brand)}
.due .who{font-weight:650;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* contact tile — styled like a business card */
.list{display:flex;flex-direction:column;gap:10px}
.tile{position:relative;display:flex;gap:13px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 14px 18px;box-shadow:var(--shadow);overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cc,var(--brand))}
.tile:active{transform:scale(.99)}
.av{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:750;color:#fff;font-size:17px;background-size:cover;background-position:center;letter-spacing:.3px}
.tile .meta{flex:1;min-width:0}
.tile .t{font-weight:680;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pills{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.pill{font-size:11.5px;padding:3px 8px;border-radius:999px;font-weight:650;background:var(--bg2);color:var(--muted)}
.pill.pdue{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--brand-soft);color:var(--brand)}
.pill.gold{background:var(--gold-soft);color:#9a6d12}
html.dark .pill.gold{color:var(--gold)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.star{color:var(--gold);font-size:18px;align-self:flex-start}

.empty{text-align:center;padding:40px 18px;color:var(--muted)}
.empty .art{margin:0 auto 14px;width:170px;height:100px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;transform:rotate(-4deg)}
.empty .art:before{content:"";position:absolute;left:16px;top:18px;width:70px;height:10px;border-radius:5px;background:var(--brand)}
.empty .art:after{content:"";position:absolute;left:16px;top:38px;width:110px;height:6px;border-radius:3px;background:var(--line);box-shadow:0 14px 0 var(--line),0 28px 0 var(--line)}
.empty h3{color:var(--ink);margin:6px 0}
.empty p{margin:6px auto 16px;max-width:300px;line-height:1.45}

/* buttons */
.btn{border-radius:14px;padding:13px 16px;font-weight:650;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:7px}
html.dark .btn{color:#062019}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:12px}
.btn.block{width:100%}

/* bottom nav + fab */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 0;font-weight:600;position:relative}
.nb.on{color:var(--brand)}
.nb .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--warn);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px;font-weight:700}
.fab{width:60px;height:60px;border-radius:20px;background:linear-gradient(150deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 10px 24px rgba(14,90,74,.35)}

/* sheets */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(10,16,14,.5);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex;animation:fade .18s}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(26px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet h2{margin:0 0 4px;font-size:22px;letter-spacing:-.3px}
.row{display:flex;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
label.f{display:block;font-size:13px;color:var(--muted);margin:13px 0 6px;font-weight:600}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:12px 13px;outline:0}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.in{min-height:84px;resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:550;color:var(--muted);flex:none}
.kv span{text-align:right;word-break:break-word}
.h4{font-size:12.5px;font-weight:750;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:20px 2px 4px}

/* the business card hero in detail */
.bizcard-wrap{perspective:1200px;margin:4px 0 14px}
.bizcard{position:relative;aspect-ratio:1.75/1;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.bizcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 14px 30px rgba(10,20,15,.18),0 2px 6px rgba(10,20,15,.08)}
.front{background:#fbf9f4;color:#1d2420;padding:18px 20px 16px 26px;display:flex;flex-direction:column}
.front:before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--cc)}
.front .biz{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.1;color:var(--cc);letter-spacing:-.2px}
.front .cat{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#7b817d;margin-top:4px}
.front .who{margin-top:auto;font-size:16px;font-weight:650;max-width:44%}
.front .ttl{font-size:12.5px;color:#6d736f;max-width:44%;line-height:1.3}
.front .contact{position:absolute;right:18px;bottom:15px;text-align:right;font-size:11.5px;line-height:1.55;color:#353b38;max-width:54%}
.front .contact div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{transform:rotateY(180deg);background:#222 center/cover no-repeat}
.back.none{background:var(--card);display:grid;place-items:center;color:var(--muted);font-size:14px;border:1px dashed var(--line)}
.fliphint{position:absolute;right:10px;top:10px;z-index:3;background:rgba(0,0,0,.45);color:#fff;font-size:11px;padding:4px 9px;border-radius:999px;font-weight:600}

.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:2px 0 4px}
.act{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px 2px 9px;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:5px}
.act svg{color:var(--brand)}
.act.off{opacity:.35;pointer-events:none}

.seg{display:flex;background:var(--bg2);border-radius:13px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);min-width:max-content}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.statusbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.statusbar::-webkit-scrollbar{display:none}
.stbtn{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--muted)}
.stbtn.on{color:#fff;border-color:transparent}

.tl{position:relative;padding-left:4px}
.tli{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.tli:last-child{border-bottom:0}
.tli .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px;background:var(--bg2)}
.tli .x{margin-left:auto;color:var(--muted);padding:2px 4px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.quick button{background:var(--bg2);border-radius:12px;padding:9px 4px;font-size:12.5px;font-weight:600}

.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.tag.on{background:var(--gold-soft);border-color:var(--gold);color:#8a5f0c}
html.dark .tag.on{color:var(--gold)}

/* insights */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.kpi b{font-size:28px;font-weight:780;display:block;letter-spacing:-.5px}
.kpi small{color:var(--muted);font-size:12.5px;font-weight:600}
.bar{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.bar .lbl{width:118px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .trk{flex:1;height:10px;border-radius:6px;background:var(--bg2);overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .n{width:28px;text-align:right;font-weight:700}
.funnel{display:flex;flex-direction:column;gap:6px}
.lb{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.lb:last-child{border-bottom:0}
.rank{width:24px;font-weight:800;color:var(--muted);text-align:center}
.medal{color:var(--gold)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:13px;font-size:14px;font-weight:550;opacity:0;transition:.25s;z-index:60;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:24px auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.scanimg{width:100%;border-radius:14px;margin-top:8px;max-height:200px;object-fit:cover;border:1px solid var(--line)}
.photo{width:100%;border-radius:14px;border:1px solid var(--line);display:block;margin-top:8px}
.notice{background:var(--brand-soft);color:var(--brand);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-top:8px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.menuitem{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15px;font-weight:550}
.menuitem:last-child{border-bottom:0}
.menuitem .mi{width:36px;height:36px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.menuitem small{display:block;color:var(--muted);font-weight:450;font-size:12.5px;margin-top:1px}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-top">
    <div>
      <div class="greet" id="greet">Good morning</div>
      <div class="brandname">Card <span>Wallet</span></div>
    </div>
    <div class="row">
      <button class="hbtn" id="themeBtn" aria-label="Theme"></button>
      <button class="hbtn" id="menuBtn" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</div>

<div class="wrap">
  <div id="view"></div>
</div>

<nav class="nav"><div class="in">
  <button class="nb on" data-nav="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M6.5 10h6M6.5 14h4"/></svg>Cards</button>
  <button class="nb" data-nav="follow"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>Follow-ups<span class="badge hide" id="dueBadge"></span></button>
  <button class="fab" id="fab" aria-label="Add card"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="nb" data-nav="refs"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>Referrals</button>
  <button class="nb" data-nav="insights"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Insights</button>
</div></nav>

<input type="file" id="scanFile" accept="image/*" capture="environment" class="hide">
<input type="file" id="photoFile" accept="image/*" class="hide">
<input type="file" id="restoreFile" accept="application/json,.json" class="hide">

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
/* ====================== constants ====================== */
const CATS = {
  "Auto":"#b4541a","Real Estate":"#3a4fb5","Food & Dining":"#a8325e","Retail":"#7a3fa0","Contractors":"#8a5a14",
  "Health & Beauty":"#1f7a99","Professional":"#0e5a4a","Nonprofit":"#5b6b1e","Other":"#4b5563"
};
const STATUSES = [
  {k:"new",l:"New lead",c:"#6b7280"},
  {k:"contacted",l:"Contacted",c:"#1f7a99"},
  {k:"interested",l:"Interested",c:"#d08a12"},
  {k:"won",l:"Won",c:"#16865f"},
  {k:"notnow",l:"Not now",c:"#9b4040"}
];
const TAGS = ["Hot lead","GLCU member","Referral partner","Business account","Auto loans","Mortgage","Event sponsor"];
const LOGTYPES = {call:["📞","Call"],visit:["🤝","Visit"],email:["✉️","Email"],text:["💬","Text"],note:["📝","Note"]};
const STATUS = Object.fromEntries(STATUSES.map(s=>[s.k,s]));
const BRIDGE = window.CardApp || null;

/* ====================== helpers ====================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today = () => ymd(new Date());
const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return ymd(d); };
const newId = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const parseD = d => { const [y,m,dd]=d.split("-").map(Number); return new Date(y,m-1,dd); };
const fmtDate = d => { if(!d) return ""; const x=parseD(d); return x.toLocaleDateString(undefined,{month:"short",day:"numeric",year:x.getFullYear()!==new Date().getFullYear()?"numeric":undefined}); };
const daysUntil = d => { if(!d) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((parseD(d)-t)/86400000); };
const relDue = d => { const n=daysUntil(d); return n<0?`${-n}d overdue`:n===0?"Today":n===1?"Tomorrow":n<7?`In ${n} days`:fmtDate(d); };
const digits = s => String(s||"").replace(/[^\d+]/g,"");
const catColor = c => CATS[c] || "#0e5a4a";
const initials = c => (c.business || c.name || "?").replace(/[^\w\s]/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "?";
const title = c => c.business || c.name || "Untitled";
const refsGot = c => (c.referrals||[]).filter(r=>r.dir==="got").length;
const refsGave = c => (c.referrals||[]).filter(r=>r.dir==="gave").length;
const lastTouch = c => (c.log||[]).reduce((m,l)=>l.date>m?l.date:m, "");

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2300); }

/* ====================== storage (IndexedDB, falls back to localStorage) ====================== */
const Store = (() => {
  let idb = null;
  const open = () => new Promise(res => {
    try {
      const r = indexedDB.open("cardwallet", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("cards", {keyPath:"id"}); r.result.createObjectStore("kv"); };
      r.onsuccess = () => { idb = r.result; res(true); };
      r.onerror = () => res(false);
    } catch(e){ res(false); }
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => { const t = idb.transaction(store, mode); const out = fn(t.objectStore(store)); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); });
  return {
    async init(){ return open(); },
    async all(){ if(!idb){ try{return JSON.parse(localStorage.getItem("cw.cards")||"[]");}catch(e){return [];} }
      return new Promise((res)=>{ const r=idb.transaction("cards").objectStore("cards").getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res([]); }); },
    async put(c){ if(!idb){ try{localStorage.setItem("cw.cards",JSON.stringify(cards));}catch(e){} return; } return tx("cards","readwrite",s=>s.put(c)); },
    async del(id){ if(!idb){ try{localStorage.setItem("cw.cards",JSON.stringify(cards));}catch(e){} return; } return tx("cards","readwrite",s=>s.delete(id)); },
    async clearAndPut(list){ if(!idb){ try{localStorage.setItem("cw.cards",JSON.stringify(list));}catch(e){} return; } return tx("cards","readwrite",s=>{ s.clear(); list.forEach(c=>s.put(c)); }); },
    get(k,d){ try{ const v=localStorage.getItem("cw."+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem("cw."+k, JSON.stringify(v)); }catch(e){} }
  };
})();

/* ====================== state ====================== */
let cards = [];
let state = { nav:"home", q:"", cat:"All", status:"all", tag:"", sort:Store.get("sort","az") };
let draft = null;
let sheetStack = []; // for back button

async function save(c){
  c.updated = Date.now();
  const i = cards.findIndex(x=>x.id===c.id);
  if (i>=0) cards[i]=c; else cards.push(c);
  try { await Store.put(c); } catch(e){ toast("Couldn't save — storage may be full"); }
  render();
}
async function remove(id){
  cards = cards.filter(c=>c.id!==id);
  try { await Store.del(id); } catch(e){}
  render();
}

function avatar(c, size=48){
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size*.36)}px;background-color:${catColor(c.category)};`;
  return `<div class="av" style="${st}">${esc(initials(c))}</div>`;
}

function renderStats(){
  const due = cards.filter(c=>c.followUp && daysUntil(c.followUp)<=0).length;
  const won = cards.filter(c=>c.status==="won").length;
  $("#stats").innerHTML = `
    <div class="stat"><b>${cards.length}</b><small>Contacts</small></div>
    <div class="stat ${due?"alert":""}"><b>${due}</b><small>Due now</small></div>
    <div class="stat"><b>${won}</b><small>Won</small></div>`;
  const b = $("#dueBadge"); b.textContent = due; b.classList.toggle("hide", !due);
  const h = new Date().getHours();
  $("#greet").textContent = h<12 ? "Good morning" : h<17 ? "Good afternoon" : "Good evening";
}

function tileHTML(c){
  const d = daysUntil(c.followUp);
  const pills = [];
  if (c.status && c.status!=="new") pills.push(`<span class="pill" style="background:${STATUS[c.status].c}22;color:${STATUS[c.status].c}">${STATUS[c.status].l}</span>`);
  if (c.followUp) pills.push(`<span class="pill ${d<=0?"pdue":"ok"}">⏰ ${relDue(c.followUp)}</span>`);
  if ((c.referrals||[]).length) pills.push(`<span class="pill blue">⇄ ${(c.referrals||[]).length}</span>`);
  (c.tags||[]).slice(0,2).forEach(t=>pills.push(`<span class="pill gold">${esc(t)}</span>`));
  return `<button class="tile" data-open="${c.id}" style="--cc:${catColor(c.category)}">
    ${avatar(c)}
    <div class="meta"><div class="t">${esc(title(c))}</div>
      <div class="s">${esc([c.business?c.name:"", c.title, c.category].filter(Boolean).join(" · ")||"—")}</div>
      ${pills.length?`<div class="pills">${pills.join("")}</div>`:""}</div>
    ${c.star?`<span class="star">★</span>`:""}
  </button>`;
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  let out = cards.filter(c=>{
    if (q && ![c.business,c.name,c.title,c.category,c.notes,c.phone,c.email,c.address,(c.tags||[]).join(" ")].join(" ").toLowerCase().includes(q)) return false;
    if (state.cat!=="All" && c.category!==state.cat) return false;
    if (state.status!=="all" && (c.status||"new")!==state.status) return false;
    if (state.tag && !(c.tags||[]).includes(state.tag)) return false;
    return true;
  });
  const s = state.sort;
  out.sort((a,b)=> s==="recent" ? (b.created||0)-(a.created||0)
    : s==="touched" ? (lastTouch(b)||"").localeCompare(lastTouch(a)||"")
    : s==="star" ? ((b.star?1:0)-(a.star?1:0)) || title(a).localeCompare(title(b))
    : title(a).localeCompare(title(b)));
  return out;
}

function renderHome(){
  if (!cards.length){
    return `<div style="height:20px"></div><div class="empty"><div class="art"></div><h3>Your wallet is empty</h3>
      <p>Scan the business cards you collect and Card Wallet keeps track of the people, the follow-ups and the referrals.</p>
      <div class="row" style="justify-content:center;gap:8px"><button class="btn" data-act="scan">${ICON.camera} Scan a card</button><button class="btn ghost" data-act="add">${ICON.pen} Type it in</button></div></div>`;
  }
  const list = filtered();
  const due = cards.filter(c=>c.followUp && daysUntil(c.followUp)<=3).sort((a,b)=>a.followUp.localeCompare(b.followUp));
  const usedCats = Object.keys(CATS).filter(c=>cards.some(x=>x.category===c));
  const usedTags = TAGS.concat(...cards.map(c=>c.tags||[])).filter((t,i,a)=>a.indexOf(t)===i && cards.some(c=>(c.tags||[]).includes(t)));
  let chips = `<button class="chip ${state.cat==="All"&&state.status==="all"&&!state.tag?"on":""}" data-filter="all">All</button>`;
  chips += STATUSES.filter(s=>cards.some(c=>(c.status||"new")===s.k)).map(s=>`<button class="chip ${state.status===s.k?"on":""}" data-status="${s.k}"><span class="dot" style="background:${s.c}"></span>${s.l}</button>`).join("");
  chips += usedCats.map(c=>`<button class="chip ${state.cat===c?"on":""}" data-cat="${esc(c)}"><span class="dot" style="background:${catColor(c)}"></span>${esc(c)}</button>`).join("");
  chips += usedTags.map(t=>`<button class="chip ${state.tag===t?"on":""}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("");
  const sortLbl = {az:"A–Z",recent:"Newest",touched:"Last contacted",star:"Starred first"}[state.sort];
  return `
    <div class="searchbar"><div class="search">${ICON.search}<input id="q" placeholder="Search people, businesses, notes…" value="${esc(state.q)}" autocomplete="off"></div>
      <button class="sortbtn" data-act="sort" aria-label="Sort">${ICON.sort}</button></div>
    <div class="chips">${chips}</div>
    ${due.length && !state.q ? `<div class="sec"><h3>Coming up</h3><button data-nav="follow">See all</button></div>
      <div class="duestrip">${due.slice(0,8).map(c=>{const d=daysUntil(c.followUp);return `<button class="due" data-open="${c.id}"><div class="when ${d>0?"soon":""}">⏰ ${relDue(c.followUp)}</div><div class="who">${esc(title(c))}</div><div class="sub">${esc(c.name&&c.business?c.name:(c.phone||c.category||""))}</div></button>`}).join("")}</div>` : ""}
    <div class="sec"><h3>${list.length} contact${list.length===1?"":"s"}</h3><button data-act="sort">${sortLbl} ▾</button></div>
    <div class="list">${list.length ? list.map(tileHTML).join("") : `<div class="empty">No matches. Try a different search or filter.</div>`}</div>`;
}

function renderFollow(){
  const withFu = cards.filter(c=>c.followUp).sort((a,b)=>a.followUp.localeCompare(b.followUp));
  const groups = [["Overdue",c=>daysUntil(c.followUp)<0],["Today",c=>daysUntil(c.followUp)===0],["This week",c=>{const d=daysUntil(c.followUp);return d>0&&d<=7}],["Later",c=>daysUntil(c.followUp)>7]];
  const cold = cards.filter(c=>!c.followUp && c.status!=="won" && c.status!=="notnow" && (!lastTouch(c) || daysUntil(lastTouch(c))<-30));
  let h = `<div style="height:16px"></div>`;
  if (!withFu.length) h += `<div class="empty"><h3>No follow-ups scheduled</h3><p>Open a contact and pick a follow-up date. They'll show up here, and you can add them to your phone's calendar.</p></div>`;
  groups.forEach(([name,fn])=>{ const g=withFu.filter(fn); if(g.length) h+=`<div class="sec"><h3>${name} · ${g.length}</h3></div><div class="list">${g.map(tileHTML).join("")}</div>`; });
  if (cold.length) h += `<div class="sec"><h3>Going cold · ${cold.length}</h3></div><p class="small muted" style="margin:-4px 2px 10px">No contact in 30+ days and no follow-up set.</p><div class="list">${cold.slice(0,10).map(tileHTML).join("")}</div>`;
  return h;
}

function renderRefs(){
  const got = cards.reduce((n,c)=>n+refsGot(c),0), gave = cards.reduce((n,c)=>n+refsGave(c),0);
  const ranked = cards.filter(c=>(c.referrals||[]).length).sort((a,b)=>(b.referrals.length)-(a.referrals.length));
  const recent = cards.flatMap(c=>(c.referrals||[]).map(r=>({...r,c}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  return `<div style="height:16px"></div>
    <div class="grid2"><div class="kpi"><b style="color:var(--brand)">${got}</b><small>Sent your way</small></div><div class="kpi"><b style="color:var(--blue)">${gave}</b><small>You sent them</small></div></div>
    <div class="sec"><h3>Top partners</h3></div>
    <div class="box" style="margin-top:0">${ranked.length ? ranked.slice(0,10).map((c,i)=>`<button class="lb" data-open="${c.id}"><div class="rank ${i<3?"medal":""}">${i<3?["🥇","🥈","🥉"][i]:i+1}</div>${avatar(c,38)}<div style="flex:1;min-width:0"><div style="font-weight:650">${esc(title(c))}</div><div class="small muted">${refsGot(c)} received · ${refsGave(c)} sent</div></div></button>`).join("") : `<div class="empty" style="padding:22px 8px">No referrals yet. Open a contact and tap <b>Log referral</b> whenever someone sends you business — or you send them some.</div>`}</div>
    ${recent.length?`<div class="sec"><h3>Recent</h3></div><div class="box" style="margin-top:0">${recent.map(r=>`<div class="tli"><div class="ic" style="background:${r.dir==="got"?"var(--brand-soft)":"var(--blue-soft)"}">${r.dir==="got"?"⬇️":"⬆️"}</div><div><div style="font-weight:600">${esc(title(r.c))}</div><div class="small muted">${esc(r.note||(r.dir==="got"?"Received a referral":"Sent a referral"))} · ${fmtDate(r.date)}</div></div></div>`).join("")}</div>`:""}`;
}

function renderInsights(){
  if (!cards.length) return `<div style="height:16px"></div><div class="empty"><h3>Nothing to show yet</h3><p>Add a few cards and you'll see your pipeline, categories and activity here.</p></div>`;
  const touches30 = cards.reduce((n,c)=>n+(c.log||[]).filter(l=>daysUntil(l.date)>=-30).length,0);
  const added30 = cards.filter(c=>c.met && daysUntil(c.met)>=-30).length;
  const won = cards.filter(c=>c.status==="won").length;
  const rate = Math.round(won/cards.length*100);
  const maxS = Math.max(1,...STATUSES.map(s=>cards.filter(c=>(c.status||"new")===s.k).length));
  const catCounts = Object.keys(CATS).map(k=>[k,cards.filter(c=>c.category===k).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  const maxC = Math.max(1,...catCounts.map(x=>x[1]));
  // activity last 8 weeks
  const weeks = Array.from({length:8},(_,i)=>{ const end=-7*i, start=end-6; return cards.reduce((n,c)=>n+(c.log||[]).filter(l=>{const d=daysUntil(l.date);return d<=end&&d>=start}).length,0); }).reverse();
  const maxW = Math.max(1,...weeks);
  return `<div style="height:16px"></div>
    <div class="grid2">
      <div class="kpi"><b>${added30}</b><small>New contacts · 30 days</small></div>
      <div class="kpi"><b>${touches30}</b><small>Touchpoints · 30 days</small></div>
      <div class="kpi"><b style="color:var(--brand)">${won}</b><small>Won</small></div>
      <div class="kpi"><b>${rate}%</b><small>Win rate</small></div>
    </div>
    <div class="sec"><h3>Pipeline</h3></div>
    <div class="box" style="margin-top:0"><div class="funnel">${STATUSES.map(s=>{const n=cards.filter(c=>(c.status||"new")===s.k).length;return `<div class="bar"><span class="lbl">${s.l}</span><div class="trk"><div class="fill" style="width:${n/maxS*100}%;background:${s.c}"></div></div><span class="n">${n}</span></div>`}).join("")}</div></div>
    <div class="sec"><h3>Activity · last 8 weeks</h3></div>
    <div class="box" style="margin-top:0"><div style="display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px">${weeks.map((n,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><span class="small" style="font-weight:700;font-size:11px">${n||""}</span><div style="width:100%;height:${Math.max(4,n/maxW*80)}px;border-radius:6px;background:${i===7?"var(--brand)":"var(--brand-soft)"}"></div></div>`).join("")}</div><div class="small muted" style="display:flex;justify-content:space-between;margin-top:6px"><span>8 wks ago</span><span>This week</span></div></div>
    <div class="sec"><h3>By category</h3></div>
    <div class="box" style="margin-top:0">${catCounts.map(([k,n])=>`<div class="bar"><span class="lbl">${esc(k)}</span><div class="trk"><div class="fill" style="width:${n/maxC*100}%;background:${catColor(k)}"></div></div><span class="n">${n}</span></div>`).join("")||`<div class="small muted">Add categories to your contacts to see this.</div>`}</div>`;
}

function render(){
  renderStats();
  document.querySelectorAll(".nb").forEach(b=>b.classList.toggle("on", b.dataset.nav===state.nav));
  const v = $("#view");
  const focused = document.activeElement && document.activeElement.id==="q";
  const pos = focused ? document.activeElement.selectionStart : 0;
  v.innerHTML = state.nav==="home" ? renderHome() : state.nav==="follow" ? renderFollow() : state.nav==="refs" ? renderRefs() : renderInsights();
  if (focused && $("#q")) { $("#q").focus(); try{$("#q").setSelectionRange(pos,pos);}catch(e){} }
}

/* ====================== sheets ====================== */

  $("#overlay").classList.add("open");

  sheetStack = [name||"sheet"];

function saveFile(filename, text){
  if (BRIDGE && BRIDGE.saveStart){
    BRIDGE.saveStart();
    for (let i=0;i<text.length;i+=200000) BRIDGE.saveAppend(text.slice(i,i+200000));
    BRIDGE.saveFinish(filename);
  } else {
    try { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"})); a.download=filename; a.click(); } catch(e){ toast("Couldn't save the file"); }
  }
}

/* ====================== images + scanning ====================== */
function loadImg(file){ return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{res(img);}; img.onerror=rej; img.src=u; }); }
function toCanvas(img, max){ const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const cv=document.createElement("canvas"); cv.width=Math.round(img.naturalWidth*s); cv.height=Math.round(img.naturalHeight*s); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); return cv; }

$("#photoFile").addEventListener("change", async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file||!draft) return;
  try { draft.photo = toCanvas(await loadImg(file), 900).toDataURL("image/jpeg",0.72); const keep=draft; const wasNew=!cards.some(c=>c.id===keep.id); openForm(wasNew?null:cards.find(c=>c.id===keep.id),{prefill:keep}); } catch(err){ toast("Couldn't read that image"); }
});

let ocrResolve = null;
window.__cwOcrDone = json => { if (ocrResolve){ const r=ocrResolve; ocrResolve=null; try { r(JSON.parse(json)); } catch(e){ r(null); } } };

$("#scanFile").addEventListener("change", async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  openSheet(`<h2>Reading card…</h2><div class="spin"></div><p class="muted small" style="text-align:center">Finding the name, phone, email and address.</p>`, "scanning");
  let photo=null, fields=null;
  try {
    const img = await loadImg(file);
    photo = toCanvas(img, 900).toDataURL("image/jpeg",0.72);
    if (BRIDGE && BRIDGE.recognize){
      const big = toCanvas(img, 1800).toDataURL("image/jpeg",0.9).split(",")[1];
      const result = await new Promise(res=>{ ocrResolve=res; BRIDGE.recognize(big); setTimeout(()=>{ if(ocrResolve===res){ ocrResolve=null; res(null);} }, 25000); });
      if (result && result.lines && result.lines.length) fields = parseCard(result.lines);
    }
  } catch(err){}
  const got = fields && Object.keys(fields).length;
  openForm(null, { prefill:{...(fields||{}), photo}, scanned:!!got, scanFail:!got });
});

/* Turns OCR lines [{text,h,y,x}] into contact fields */
function parseCard(lines){
  const L = lines.map(l=>({ text:String(l.text||"").replace(/\s+/g," ").trim(), h:+l.h||0, y:+l.y||0 })).filter(l=>l.text.length>1);
  const out = {}; const used = new Set();
  const emailRe=/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i;
  const webRe=/\b((?:https?:\/\/)?(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|net|org|biz|us|co|info|io|edu|gov|realtor|law|bank|cu)(?:\/\S*)?)\b/i;
  const phoneRe=/(?:\+?1[\s.-]*)?\(?(\d{3})\)?[\s.-]*(\d{3})[\s.-]*(\d{4})/;
  const titleRe=/\b(owner|co-owner|manager|president|vice president|vp|ceo|cfo|coo|cto|director|agent|realtor|broker|consultant|specialist|officer|founder|partner|advisor|adviser|associate|technician|coordinator|head|lead|chef|baker|stylist|attorney|lawyer|dds|dmd|md|dr\.?|sales|representative|rep|supervisor|principal|designer|engineer|accountant|cpa|planner|assistant|administrator|executive|instructor|trainer|therapist|groomer|mechanic|contractor|electrician|plumber)\b/i;
  const streetRe=/\b\d{1,6}\s+[\w.'\- ]+\b(st|street|ave|avenue|rd|road|blvd|boulevard|dr|drive|ln|lane|way|ct|court|hwy|highway|route|rt|pkwy|parkway|pl|place|cir|circle|trl|trail|ter|sq)\b\.?/i;
  const cityRe=/\b[A-Za-z .'-]+,?\s+(AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY)\b\.?(\s+\d{5}(-\d{4})?)?/;
  // email
  L.forEach((l,i)=>{ const m=l.text.match(emailRe); if(m && !out.email){ out.email=m[0].toLowerCase(); if(l.text.replace(m[0],"").replace(/e-?mail:?/i,"").trim().length<3) used.add(i);} });
  // phone — prefer office/main/cell labels in that order of appearance
  const phones = [];
  L.forEach((l,i)=>{ const m=l.text.match(phoneRe); if(m){ phones.push({i, label:(l.text.match(/\b(cell|mobile|m|c|office|o|main|tel|t|phone|p|direct|d|fax|f)\b/i)||[])[1]||"", num:`(${m[1]}) ${m[2]}-${m[3]}`}); } });
  const notFax = phones.filter(p=>!/^f(ax)?$/i.test(p.label));
  const pick = notFax.find(p=>/^(cell|mobile|m|c|direct|d)$/i.test(p.label)) || notFax[0];
  if (pick){ out.phone=pick.num; }
  phones.forEach(p=>{ const rest=L[p.i].text.replace(phoneRe,"").replace(/\b(cell|mobile|office|main|tel|phone|direct|fax|ph)\b|[a-z]\s*[:.]/gi,"").replace(/[^\w]/g,""); if(rest.length<4) used.add(p.i); });
  // website
  L.forEach((l,i)=>{ if(out.website) return; const t=l.text.replace(emailRe,""); const m=t.match(webRe); if(m && !/@/.test(m[0])){ out.website=m[1].replace(/^https?:\/\//i,"").replace(/^www\./i,"").replace(/\/$/,"").toLowerCase(); if(t.replace(m[0],"").trim().length<4) used.add(i);} });
  if (!out.website && out.email){ const dom=out.email.split("@")[1]; if(!/gmail|yahoo|hotmail|outlook|aol|icloud|comcast|att\.net|live\.com|msn/i.test(dom)) out.website=dom; }
  // address
  L.forEach((l,i)=>{ if(out.address || used.has(i)) return;
    if (streetRe.test(l.text)){
      let a=l.text.replace(phoneRe,"").replace(emailRe,"").trim(); used.add(i);
      if (!cityRe.test(a)){ const nx=L.findIndex((x,j)=>j!==i && !used.has(j) && cityRe.test(x.text) && Math.abs(x.y-l.y)<l.h*4); if(nx>=0){ a+=", "+L[nx].text.trim(); used.add(nx);} }
      out.address=a.replace(/\s*[|•·]\s*/g,", ").replace(/,\s*,/g,",");
    }
  });
  if (!out.address){ const ci=L.findIndex((l,i)=>!used.has(i) && cityRe.test(l.text) && /\d{5}/.test(l.text)); if(ci>=0){ out.address=L[ci].text; used.add(ci);} }
  // title
  let ti=-1; L.forEach((l,i)=>{ if(ti<0 && !used.has(i) && titleRe.test(l.text) && l.text.split(" ").length<=7 && !/\d/.test(l.text)){ ti=i; } });
  // name: 2-4 words, letters only, capitalized, close to title if found
  const isName = t => /^[A-Z][a-zA-Z'.-]+(\s+[A-Z][a-zA-Z'.-]*){1,3}(,?\s+(Jr|Sr|II|III|MD|CPA|DDS)\.?)?$/.test(t) && !titleRe.test(t) && !/\b(inc|llc|co|company|corp|group|bank|services|shop|bakery|auto|realty|salon|studio|restaurant|cafe|grill|clinic|center|insurance)\b/i.test(t);
  let ni=-1;
  if (ti>=0){ const near=L.map((l,i)=>({l,i})).filter(o=>!used.has(o.i) && o.i!==ti && isName(o.l.text)).sort((a,b)=>Math.abs(a.l.y-L[ti].y)-Math.abs(b.l.y-L[ti].y)); if(near.length) ni=near[0].i; }
  if (ni<0) ni = L.findIndex((l,i)=>!used.has(i) && i!==ti && isName(l.text));
  // a name line that also contains the title, e.g. "Dana Whitfield, Owner"
  if (ni<0 && ti>=0){ const m=L[ti].text.match(/^([A-Z][a-z'.-]+(?:\s+[A-Z][a-z'.-]+){1,2})\s*[,|–-]\s*(.+)$/); if(m){ out.name=m[1]; out.title=m[2]; used.add(ti); ti=-2; } }
  if (ni>=0){ out.name=L[ni].text; used.add(ni); }
  if (ti>=0){ out.title=L[ti].text.replace(/^[,|–-]\s*/,""); used.add(ti); }
  // business: tallest remaining line (merge with an adjacent equally tall line)
  const rest = L.map((l,i)=>({l,i})).filter(o=>!used.has(o.i) && /[a-z]/i.test(o.l.text) && o.l.text.length<=48 && !emailRe.test(o.l.text));
  const corp = rest.find(o=>/\b(inc|llc|l\.l\.c|co\.|company|corp|group|realty|bank|insurance|credit union)\b/i.test(o.l.text));
  rest.sort((a,b)=>b.l.h-a.l.h);
  const top = corp && corp.l.h >= (rest[0]?.l.h||0)*0.7 ? corp : rest[0];
  if (top){
    let b = top.l.text;
    const pair = rest.find(o=>o.i!==top.i && Math.abs(o.l.h-top.l.h)<top.l.h*0.15 && Math.abs(o.l.y-top.l.y)<top.l.h*1.6 && o.l.text.length<30);
    if (pair && pair.l.text.split(" ").length<=4) b = pair.l.y<top.l.y ? pair.l.text+" "+b : b+" "+pair.l.text;
    out.business = b.replace(/\s+/g," ").trim();
    if (out.business && /^[A-Z0-9 &'.-]+$/.test(out.business) && out.business.length>4) out.business = out.business.toLowerCase().replace(/\b[a-z]/g,m=>m.toUpperCase()).replace(/\b(Llc|Inc)\b/g,m=>m.toUpperCase()==="LLC"?"LLC":"Inc");
  }
  if (out.name && /^[A-Z\s'.-]+$/.test(out.name)) out.name = out.name.toLowerCase().replace(/\b[a-z]/g,m=>m.toUpperCase());
  out.category = guessCategory([out.business,out.title,out.website,L.map(l=>l.text).join(" ")].join(" "));
  Object.keys(out).forEach(k=>{ if(!out[k]) delete out[k]; });
  return out;
}
function guessCategory(t){
  const map = [
    ["Auto",/\b(auto|car|cars|motors?|tire|tires|collision|body shop|mechanic|dealership|automotive|transmission|oil change|towing)\b/i],
    ["Real Estate",/\b(realt(y|or)|real estate|homes|properties|property|mortgage|broker|title company|re\/max|keller williams|century 21|coldwell)\b/i],
    ["Food & Dining",/\b(bakery|cafe|caf[ée]|coffee|restaurant|grill|pizza|pizzeria|bar|pub|catering|kitchen|deli|bistro|brew|tavern|taco|donut|diner)\b/i],
    ["Contractors",/\b(construction|roofing|plumbing|plumber|electric|electrician|hvac|heating|cooling|landscap|remodel|contractor|builders?|painting|concrete|flooring|handyman|excavat)\b/i],
    ["Health & Beauty",/\b(salon|spa|barber|nails?|dental|dentist|dds|clinic|chiropract|physical therapy|fitness|gym|massage|med ?spa|beauty|optometr|vision|pharmacy|wellness|md)\b/i],
    ["Professional",/\b(law|attorney|legal|cpa|accounting|tax|insurance|financial|consulting|marketing|agency|design|it services|technology|solutions)\b/i],
    ["Nonprofit",/\b(foundation|nonprofit|non-profit|church|charity|association|chamber of commerce|rotary|lions club|ymca)\b/i],
    ["Retail",/\b(shop|store|boutique|market|outlet|gifts?|jewel|florist|flowers|hardware|furniture|supply|retail)\b/i],
  ];
  for (const [k,re] of map) if (re.test(t)) return k;
  return "";
}

/* ====================== events ====================== */
document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-nav],[data-open],[data-act],[data-cat],[data-status],[data-tag],[data-filter],[data-tagt],[data-log]"); if(!t) return;
  if (t.dataset.log){ // call/text/email: record it, let the link open
    const c=cards.find(x=>x.id===t.dataset.id); if(c){ c.log=(c.log||[]).concat([{id:newId(),type:t.dataset.log,note:"",date:today()}]); if((c.status||"new")==="new") c.status="contacted"; save(c); setTimeout(()=>openDetail(c.id),400); }
    return;
  }
  if (t.dataset.nav){ state.nav=t.dataset.nav; closeSheet(); render(); window.scrollTo(0,0); return; }
  if (t.dataset.open){ openDetail(t.dataset.open); return; }
  if (t.dataset.filter){ state.cat="All"; state.status="all"; state.tag=""; render(); return; }
  if (t.dataset.cat){ state.cat = state.cat===t.dataset.cat?"All":t.dataset.cat; render(); return; }
  if (t.dataset.status){ state.status = state.status===t.dataset.status?"all":t.dataset.status; render(); return; }
  if (t.dataset.tag){ state.tag = state.tag===t.dataset.tag?"":t.dataset.tag; render(); return; }
  if (t.dataset.tagt){ const tg=t.dataset.tagt; draft.tags = draft.tags.includes(tg) ? draft.tags.filter(x=>x!==tg) : draft.tags.concat([tg]); t.classList.toggle("on"); return; }
  const a=t.dataset.act, id=t.dataset.id, c=cards.find(x=>x.id===id);
  switch(a){
    case "add": openForm(null); break;
    case "scan": $("#scanFile").click(); break;
    case "cancel": closeSheet(); break;
    case "back": id && cards.some(x=>x.id===id) ? openDetail(id) : closeSheet(); break;
    case "sort": openSort(); break;
    case "setsort": state.sort=t.dataset.s; Store.set("sort",state.sort); closeSheet(); render(); break;
    case "photo": $("#photoFile").click(); break;
    case "photorm": delete draft.photo; { const keep=draft; const wasNew=!cards.some(x=>x.id===keep.id); openForm(wasNew?null:cards.find(x=>x.id===keep.id),{prefill:keep}); } break;
    case "tagnew": openTagPrompt(); break;
    case "save": {
      if (!(draft.business||"").trim() && !(draft.name||"").trim()){ toast("Add a business or contact name"); return; }
      Object.keys(draft).forEach(k=>{ if(typeof draft[k]==="string") draft[k]=draft[k].trim(); });
      const d2=draft; await save(d2); toast("Contact saved"); openDetail(d2.id); break;
    }
    case "edit": openForm(c); break;
    case "del": confirmSheet(`Delete ${title(c)}?`, "This removes the contact, its activity and referrals.", "Delete", ()=>{ remove(id); toast("Deleted"); }); break;
    case "star": c.star=!c.star; await save(c); openDetail(id); break;
    case "status": c.status=t.dataset.s; await save(c); openDetail(id); if(c.status==="won") toast("🎉 Nice work!"); break;
    case "fu": c.followUp=addDays(Number(t.dataset.n)); await save(c); toast("Follow-up: "+fmtDate(c.followUp)); openDetail(id); break;
    case "fuclear": c.followUp=""; await save(c); toast("Follow-up done"); openDetail(id); break;
    case "calendar": try{ BRIDGE.addCalendar(`Follow up: ${title(c)}`, contactText(c)+(c.notes?"\n\n"+c.notes:""), c.followUp); }catch(err){ toast("Couldn't open calendar"); } break;
    case "lognew": openLogForm(id, t.dataset.t); break;
    case "logsave": {
      const n=Number($("#logfu .on").dataset.d);
      c.log=(c.log||[]).concat([{id:newId(),type:t.dataset.t,note:$("#lognote").value.trim(),date:$("#logdate").value||today()}]);
      if (n) c.followUp=addDays(n);
      if ((c.status||"new")==="new" && t.dataset.t!=="note") c.status="contacted";
      await save(c); toast("Logged"); openDetail(id); break;
    }
    case "logdel": c.log=(c.log||[]).filter(l=>l.id!==t.dataset.l); await save(c); openDetail(id); break;
    case "refnew": openRefForm(id); break;
    case "refsave": c.referrals=(c.referrals||[]).concat([{id:newId(),dir:$("#refdir .on").dataset.d,note:$("#refnote").value.trim(),date:$("#refdate").value||today()}]); await save(c); toast("Referral logged"); openDetail(id); break;
    case "refdel": c.referrals=(c.referrals||[]).filter(r=>r.id!==t.dataset.r); await save(c); openDetail(id); break;
    case "copy": copyText(contactText(c),"Contact info copied"); break;
    case "share": try{ BRIDGE.share(title(c), contactText(c)); }catch(err){ copyText(contactText(c)); } break;
    case "tocontacts": try{ BRIDGE.addContact(JSON.stringify({name:c.name||c.business, company:c.business||"", title:c.title||"", phone:c.phone||"", email:c.email||"", address:c.address||"", notes:[c.website,c.notes].filter(Boolean).join("\n")})); }catch(err){ toast("Couldn't open contacts"); } break;
    case "backup": saveFile(`card-wallet-backup-${today()}.json`, JSON.stringify({app:"Card Wallet",version:2,exported:new Date().toISOString(),cards})); break;
    case "restore": $("#restoreFile").click(); break;
    case "csv": if(!cards.length) return toast("No contacts yet"); saveFile(`card-wallet-${today()}.csv`, toCSV()); break;
    case "theme": { const order=["auto","light","dark"]; const cur=Store.get("theme","auto"); Store.set("theme",order[(order.indexOf(cur)+1)%3]); applyTheme(); openMenu(); break; }
    case "demo": { const d=demo(); for(const x of d){ cards.push(x); await Store.put(x); } closeSheet(); render(); toast("Sample contacts added"); break; }
  }
});
document.addEventListener("change", async e=>{
  const t=e.target; if(t.dataset.act!=="fudate") return;
  const c=cards.find(x=>x.id===t.dataset.id); if(!c) return; c.followUp=t.value; await save(c); openDetail(c.id);
});
document.addEventListener("input", e=>{ if(e.target.id==="q"){ state.q=e.target.value; render(); } });

function openTagPrompt(){
  const keep = draft;
  const host = document.createElement("div");
  host.innerHTML = `<div class="row" style="margin-top:8px;gap:6px"><input class="in" id="newtag" placeholder="New tag" maxlength="24"><button class="btn sm" id="addtag">Add</button></div>`;
  $("#tagrow").after(host); $("#newtag").focus();
  $("#addtag").onclick = () => { const v=$("#newtag").value.trim(); if(!v) return; if(!keep.tags.includes(v)) keep.tags.push(v); const wasNew=!cards.some(x=>x.id===keep.id); openForm(wasNew?null:cards.find(x=>x.id===keep.id),{prefill:keep}); };
}

$("#restoreFile").addEventListener("change", async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  try {
    const data = JSON.parse(await file.text()); const list = Array.isArray(data) ? data : data.cards;
    if (!Array.isArray(list)) throw 0;
    confirmSheet(`Restore ${list.length} contacts?`, "Contacts in the backup are added. Ones you already have are updated to the backup's version.", "Restore", async ()=>{
      const byId = new Map(cards.map(c=>[c.id,c])); list.forEach(c=>{ if(c && c.id) byId.set(c.id,c); });
      cards = [...byId.values()]; await Store.clearAndPut(cards); render(); toast("Restored ✓");
    });
  } catch(err){ toast("That isn't a Card Wallet backup"); }
});

$("#fab").onclick = () => openSheet(`<h2>Add a contact</h2><p class="muted small" style="margin-top:2px">Snap the card and the details fill themselves in.</p>
  <div style="display:grid;gap:10px;margin-top:14px">
    <button class="btn block" data-act="scan" style="padding:16px">${ICON.camera} Scan a business card</button>
    <button class="btn ghost block" data-act="add" style="padding:16px">${ICON.pen} Type it in</button>
  </div>`, "fabmenu");
$("#menuBtn").onclick = openMenu;

/* Android back button asks this */
window.__cwBack = () => {
  if ($("#overlay").classList.contains("open")){ closeSheet(); return true; }
  if (state.nav!=="home"){ state.nav="home"; render(); window.scrollTo(0,0); return true; }
  return false;
};

/* ====================== boot ====================== */
(async () => {
  applyTheme();
  await Store.init();
  cards = await Store.all();
  render();
})();
window.__cw = { parseCard, guessCategory }; // for testing
})();
</script>
